<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 550" role="img" aria-label="Single-core CPU block diagram: control unit fetches through PC, L1i and IR, decodes and drives ALU, FPU and vector unit via control signals, which exchange operands and results with the register file over a shared bus; the register file also talks to L1d for loads and stores.">
  <defs>
    <marker id="arrowN" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c9c9c9"/>
    </marker>
    <marker id="arrowG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#22c55e"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="550" fill="#121212"/>

  <text x="500" y="24" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="15" fill="#8a8a8a">Single-Core CPU — Classic Block Diagram</text>

  <!-- Row 1: fetch / decode chain -->
  <g font-family="JetBrains Mono, monospace">
    <rect x="60" y="60" width="150" height="70" rx="10" fill="#1a1a1a" stroke="#3f3f3f" stroke-width="2"/>
    <text x="135" y="100" text-anchor="middle" font-size="14" fill="#f2f2f2">Program</text>
    <text x="135" y="118" text-anchor="middle" font-size="14" fill="#f2f2f2">Counter</text>

    <rect x="270" y="60" width="150" height="70" rx="10" fill="#1a1a1a" stroke="#3f3f3f" stroke-width="2"/>
    <text x="345" y="100" text-anchor="middle" font-size="14" fill="#f2f2f2">L1i</text>
    <text x="345" y="118" text-anchor="middle" font-size="12" fill="#8a8a8a">instr. cache</text>

    <rect x="480" y="60" width="150" height="70" rx="10" fill="#1a1a1a" stroke="#3f3f3f" stroke-width="2"/>
    <text x="555" y="100" text-anchor="middle" font-size="14" fill="#f2f2f2">Instruction</text>
    <text x="555" y="118" text-anchor="middle" font-size="14" fill="#f2f2f2">Register</text>

    <rect x="690" y="60" width="230" height="70" rx="10" fill="#1a1a1a" stroke="#22c55e" stroke-width="2.5"/>
    <text x="805" y="100" text-anchor="middle" font-size="14" fill="#f2f2f2">Control Unit</text>
    <text x="805" y="118" text-anchor="middle" font-size="12" fill="#8a8a8a">fetch · decode · exec · wb</text>

    <!-- fetch chain arrows -->
    <line x1="212" y1="95" x2="266" y2="95" stroke="#c9c9c9" stroke-width="2" marker-end="url(#arrowN)"/>
    <text x="239" y="85" text-anchor="middle" font-size="11" fill="#8a8a8a">fetch addr</text>

    <line x1="422" y1="95" x2="476" y2="95" stroke="#c9c9c9" stroke-width="2" marker-end="url(#arrowN)"/>
    <text x="449" y="85" text-anchor="middle" font-size="11" fill="#8a8a8a">instr. bytes</text>

    <line x1="632" y1="95" x2="686" y2="95" stroke="#c9c9c9" stroke-width="2" marker-end="url(#arrowN)"/>
    <text x="659" y="85" text-anchor="middle" font-size="11" fill="#8a8a8a">opcode</text>

    <!-- CU updates PC every cycle (sequential or branch target) -->
    <path d="M805,58 C805,36 135,36 135,58" fill="none" stroke="#22c55e" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrowG)"/>
    <text x="470" y="32" text-anchor="middle" font-size="11" fill="#22c55e">update PC (sequential / branch)</text>

    <!-- control bus down to execution units -->
    <line x1="805" y1="130" x2="805" y2="195" stroke="#22c55e" stroke-width="2" stroke-dasharray="5 4"/>
    <line x1="185" y1="195" x2="805" y2="195" stroke="#22c55e" stroke-width="2" stroke-dasharray="5 4"/>
    <text x="495" y="185" text-anchor="middle" font-size="11" fill="#22c55e">control signals</text>
    <line x1="185" y1="195" x2="185" y2="246" stroke="#22c55e" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrowG)"/>
    <line x1="395" y1="195" x2="395" y2="246" stroke="#22c55e" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrowG)"/>
    <line x1="605" y1="195" x2="605" y2="246" stroke="#22c55e" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrowG)"/>
    <line x1="815" y1="195" x2="815" y2="246" stroke="#22c55e" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrowG)"/>

    <!-- Row 2: execution units -->
    <rect x="100" y="250" width="170" height="90" rx="10" fill="#1a1a1a" stroke="#3f3f3f" stroke-width="2"/>
    <text x="185" y="290" text-anchor="middle" font-size="14" fill="#f2f2f2">Register</text>
    <text x="185" y="308" text-anchor="middle" font-size="14" fill="#f2f2f2">File</text>
    <text x="185" y="325" text-anchor="middle" font-size="11" fill="#8a8a8a">GPR / FPR / vector</text>

    <rect x="310" y="250" width="170" height="90" rx="10" fill="#1a1a1a" stroke="#3f3f3f" stroke-width="2"/>
    <text x="395" y="300" text-anchor="middle" font-size="14" fill="#f2f2f2">ALU</text>

    <rect x="520" y="250" width="170" height="90" rx="10" fill="#1a1a1a" stroke="#3f3f3f" stroke-width="2"/>
    <text x="605" y="300" text-anchor="middle" font-size="14" fill="#f2f2f2">FPU</text>

    <rect x="730" y="250" width="170" height="90" rx="10" fill="#1a1a1a" stroke="#3f3f3f" stroke-width="2"/>
    <text x="815" y="300" text-anchor="middle" font-size="14" fill="#f2f2f2">Vector Unit</text>

    <!-- shared operand/result bus -->
    <line x1="185" y1="340" x2="815" y2="340" stroke="#c9c9c9" stroke-width="2"/>
    <text x="495" y="354" text-anchor="middle" font-size="11" fill="#8a8a8a">operand / result bus</text>

    <!-- register file to L1d -->
    <line x1="185" y1="340" x2="185" y2="424" stroke="#c9c9c9" stroke-width="2" marker-start="url(#arrowN)" marker-end="url(#arrowN)"/>
    <text x="200" y="385" font-size="11" fill="#8a8a8a">load / store</text>

    <rect x="90" y="430" width="190" height="80" rx="10" fill="#1a1a1a" stroke="#3f3f3f" stroke-width="2"/>
    <text x="185" y="465" text-anchor="middle" font-size="14" fill="#f2f2f2">L1d</text>
    <text x="185" y="483" text-anchor="middle" font-size="12" fill="#8a8a8a">data cache</text>
  </g>
</svg>
