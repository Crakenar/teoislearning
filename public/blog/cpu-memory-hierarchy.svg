<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 570" role="img" aria-label="Multi-core memory hierarchy: four cores each with private L1 and L2, snooping each other over a MESI coherence bus, all falling through to a shared L3 cache and then shared RAM on a miss.">
  <defs>
    <marker id="arrowN2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c9c9c9"/>
    </marker>
    <marker id="arrowG2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#22c55e"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="570" fill="#121212"/>

  <text x="500" y="20" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="15" fill="#8a8a8a">Multi-Core Memory Hierarchy</text>

  <g font-family="JetBrains Mono, monospace">
    <!-- coherence bus above the cores: private L1/L2s snoop each other -->
    <text x="500" y="44" text-anchor="middle" font-size="11" fill="#22c55e">coherence bus (MESI/MSI) — invalidate / downgrade</text>
    <line x1="180" y1="60" x2="819" y2="60" stroke="#22c55e" stroke-width="2" stroke-dasharray="5 4"/>
    <line x1="180" y1="60" x2="180" y2="88" stroke="#22c55e" stroke-width="2" stroke-dasharray="5 4" marker-start="url(#arrowG2)" marker-end="url(#arrowG2)"/>
    <line x1="393" y1="60" x2="393" y2="88" stroke="#22c55e" stroke-width="2" stroke-dasharray="5 4" marker-start="url(#arrowG2)" marker-end="url(#arrowG2)"/>
    <line x1="606" y1="60" x2="606" y2="88" stroke="#22c55e" stroke-width="2" stroke-dasharray="5 4" marker-start="url(#arrowG2)" marker-end="url(#arrowG2)"/>
    <line x1="819" y1="60" x2="819" y2="88" stroke="#22c55e" stroke-width="2" stroke-dasharray="5 4" marker-start="url(#arrowG2)" marker-end="url(#arrowG2)"/>

    <!-- 4 cores -->
    <g>
      <rect x="90" y="90" width="180" height="140" rx="10" fill="#1a1a1a" stroke="#3f3f3f" stroke-width="2"/>
      <text x="180" y="112" text-anchor="middle" font-size="14" fill="#f2f2f2">Core 0</text>
      <text x="180" y="135" text-anchor="middle" font-size="11" fill="#8a8a8a">CU · Registers</text>
      <text x="180" y="153" text-anchor="middle" font-size="11" fill="#8a8a8a">ALU / FPU / Vector</text>
      <line x1="100" y1="170" x2="260" y2="170" stroke="#3f3f3f" stroke-width="1"/>
      <text x="180" y="205" text-anchor="middle" font-size="12" fill="#f2f2f2">L1 + L2 (private)</text>
    </g>
    <g>
      <rect x="303" y="90" width="180" height="140" rx="10" fill="#1a1a1a" stroke="#3f3f3f" stroke-width="2"/>
      <text x="393" y="112" text-anchor="middle" font-size="14" fill="#f2f2f2">Core 1</text>
      <text x="393" y="135" text-anchor="middle" font-size="11" fill="#8a8a8a">CU · Registers</text>
      <text x="393" y="153" text-anchor="middle" font-size="11" fill="#8a8a8a">ALU / FPU / Vector</text>
      <line x1="313" y1="170" x2="473" y2="170" stroke="#3f3f3f" stroke-width="1"/>
      <text x="393" y="205" text-anchor="middle" font-size="12" fill="#f2f2f2">L1 + L2 (private)</text>
    </g>
    <g>
      <rect x="516" y="90" width="180" height="140" rx="10" fill="#1a1a1a" stroke="#3f3f3f" stroke-width="2"/>
      <text x="606" y="112" text-anchor="middle" font-size="14" fill="#f2f2f2">Core 2</text>
      <text x="606" y="135" text-anchor="middle" font-size="11" fill="#8a8a8a">CU · Registers</text>
      <text x="606" y="153" text-anchor="middle" font-size="11" fill="#8a8a8a">ALU / FPU / Vector</text>
      <line x1="526" y1="170" x2="686" y2="170" stroke="#3f3f3f" stroke-width="1"/>
      <text x="606" y="205" text-anchor="middle" font-size="12" fill="#f2f2f2">L1 + L2 (private)</text>
    </g>
    <g>
      <rect x="729" y="90" width="180" height="140" rx="10" fill="#1a1a1a" stroke="#3f3f3f" stroke-width="2"/>
      <text x="819" y="112" text-anchor="middle" font-size="14" fill="#f2f2f2">Core 3</text>
      <text x="819" y="135" text-anchor="middle" font-size="11" fill="#8a8a8a">CU · Registers</text>
      <text x="819" y="153" text-anchor="middle" font-size="11" fill="#8a8a8a">ALU / FPU / Vector</text>
      <line x1="739" y1="170" x2="899" y2="170" stroke="#3f3f3f" stroke-width="1"/>
      <text x="819" y="205" text-anchor="middle" font-size="12" fill="#f2f2f2">L1 + L2 (private)</text>
    </g>

    <!-- cores fall through to shared L3 on an L2 miss -->
    <text x="500" y="285" text-anchor="middle" font-size="11" fill="#8a8a8a">miss ↓ / fill ↑</text>
    <line x1="180" y1="230" x2="180" y2="350" stroke="#c9c9c9" stroke-width="2" marker-end="url(#arrowN2)"/>
    <line x1="393" y1="230" x2="393" y2="350" stroke="#c9c9c9" stroke-width="2" marker-end="url(#arrowN2)"/>
    <line x1="606" y1="230" x2="606" y2="350" stroke="#c9c9c9" stroke-width="2" marker-end="url(#arrowN2)"/>
    <line x1="819" y1="230" x2="819" y2="350" stroke="#c9c9c9" stroke-width="2" marker-end="url(#arrowN2)"/>

    <rect x="90" y="350" width="819" height="80" rx="10" fill="#1a1a1a" stroke="#3f3f3f" stroke-width="2"/>
    <text x="500" y="385" text-anchor="middle" font-size="14" fill="#f2f2f2">L3 Cache — shared</text>
    <text x="500" y="403" text-anchor="middle" font-size="12" fill="#8a8a8a">~40 cycles</text>

    <text x="515" y="452" font-size="11" fill="#8a8a8a">miss ↓ / fill ↑</text>
    <line x1="500" y1="430" x2="500" y2="470" stroke="#c9c9c9" stroke-width="2" marker-end="url(#arrowN2)"/>

    <rect x="350" y="470" width="300" height="70" rx="10" fill="#1a1a1a" stroke="#3f3f3f" stroke-width="2"/>
    <text x="500" y="498" text-anchor="middle" font-size="14" fill="#f2f2f2">RAM</text>
    <text x="500" y="516" text-anchor="middle" font-size="12" fill="#8a8a8a">~200 cycles / ~65 ns</text>
  </g>
</svg>
